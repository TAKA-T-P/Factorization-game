        function checkExpandAnswer() {
            const needsX = currentQuestion.xCoeff !== 0;
            const needsConst = currentQuestion.constant !== 0;

            let hasCorrectX = !needsX;
            let hasCorrectConst = !needsConst;

            if (needsX) {
                hasCorrectX = selectedAnswers.some(ans => ans.type === 'x' && ans.value === currentQuestion.xCoeff);
            }
            if (needsConst) {
                hasCorrectConst = selectedAnswers.some(ans => ans.type === 'const' && ans.value === currentQuestion.constant);
            }

            // 中間正解音の再生チェック
            if (selectedAnswers.length === 1) {
                const firstAnswer = selectedAnswers[0];
                if ((firstAnswer.type === 'x' && firstAnswer.value === currentQuestion.xCoeff) ||
                    (firstAnswer.type === 'const' && firstAnswer.value === currentQuestion.constant)) {
                    playSound(partialCorrectSound);
                }
            }

            if (hasCorrectX && hasCorrectConst) {
                if ((!needsX || selectedAnswers.some(ans => ans.type === 'x')) &&
                    (!needsConst || selectedAnswers.some(ans => ans.type === 'const'))) {

                    const wrongSelection = selectedAnswers.some(ans =>
                        (ans.type === 'x' && ans.value !== currentQuestion.xCoeff) ||
                        (ans.type === 'const' && ans.value !== currentQuestion.constant)
                    );

                    if (!wrongSelection) {
                        correctAnswer();
                        return;
                    }
                }
            }

            if (selectedAnswers.length > 0) {
                const wrongSelection = selectedAnswers.some(ans =>
                    (ans.type === 'x' && ans.value !== currentQuestion.xCoeff) ||
                    (ans.type === 'const' && ans.value !== currentQuestion.constant)
                );

                if (wrongSelection) {
                    wrongAnswer();
                }
            }
        }

        function generateFactorizeQuestion() {
            // ハードモードの場合
            if (difficultyMode === 'hard') {
                // 共通因数パターン: 約15%の確率
                if (Math.random() < 0.15) {
                    generateFactorizeCommonFactorPattern();
                    return;
                }
                // 残り85%のうち50%でハード問題を出題
                if (Math.random() < 0.5) {
                    generateFactorizeHardQuestion();
                    return;
                }
            }

            // ノーマル問題: 20%の確率で2乗の答えになる問題を生成
            const isSquare = Math.random() < 0.2;

            let p, q;
            do {
                if (isSquare) {
                    p = getRandomNonZero();
                    q = p; // 同じ値にして2乗の答えにする
                } else {
                    p = getRandomNonZero();
                    q = getRandomNonZero();
                    // 偶然同じ値にならないよう調整
                    while (q === p) {
                        q = getRandomNonZero();
                    }
                }
                // 直前の問題と同じでないかチェック（順序は問わない）
            } while (lastQuestionValues &&
                     ((lastQuestionValues.p === p && lastQuestionValues.q === q) ||
                      (lastQuestionValues.p === q && lastQuestionValues.q === p)));

            const xCoeff = p + q;
            const constant = p * q;

            const questionText = `x²${xCoeff !== 0 ? (xCoeff >= 0 ? '+' : '') + (xCoeff === 1 ? '' : xCoeff === -1 ? '-' : xCoeff) + 'x' : ''}${constant >= 0 ? '+' : ''}${constant} = ______`;

            currentQuestion = {
                text: questionText,
                p: p,
                q: q,
                original: `x²${xCoeff !== 0 ? (xCoeff >= 0 ? '+' : '') + (xCoeff === 1 ? '' : xCoeff === -1 ? '-' : xCoeff) + 'x' : ''}${constant >= 0 ? '+' : ''}${constant}`,
                answer: p === q ? `(x${p >= 0 ? '+' : ''}${p})²` : `(x${p >= 0 ? '+' : ''}${p})(x${q >= 0 ? '+' : ''}${q})`,
                hardPattern: 0 // ノーマル問題
            };

            // 現在の問題の値を保存
            lastQuestionValues = { p, q };

            document.getElementById('question').innerHTML = formatMathText(questionText);
            generateFactorizeAnswers();
        }

        function generateFactorizeHardQuestion() {
            // 重み付きランダム選択（パターン1を3倍の確率で出題）
            // パターン1: 重み3, パターン2-5: 重み1（合計7）
            const rand = Math.random() * 7;
            let pattern;
            if (rand < 3) {
                pattern = 1; // 約43%の確率
            } else if (rand < 4) {
                pattern = 2; // 約14%の確率
            } else if (rand < 5) {
                pattern = 3; // 約14%の確率
            } else if (rand < 6) {
                pattern = 4; // 約14%の確率
            } else {
                pattern = 5; // 約14%の確率
            }

            switch (pattern) {
                case 1: generateFactorizePattern1(); break; // x²+(a+b)xy+ab·y² = (x+ay)(x+by)
                case 2: generateFactorizePattern2(); break; // c²x²+2cdx+d² = (cx+d)²
                case 3: generateFactorizePattern3(); break; // c²x²+2cdxy+d²y² = (cx+dy)²
                case 4: generateFactorizePattern4(); break; // c²x²-d² = (cx+d)(cx-d)
                case 5: generateFactorizePattern5(); break; // c²x²-d²y² = (cx+dy)(cx-dy)
            }
        }

        // 因数分解パターン1: x²+(a+b)xy+ab·y² = (x+ay)(x+by)
        function generateFactorizePattern1() {
            let a, b;
            do {
                a = getRandomNonZeroSmall();
                b = getRandomNonZeroSmall();
                while (b === a) {
                    b = getRandomNonZeroSmall();
                }

                     ((lastQuestionValues.a === a && lastQuestionValues.b === b) ||
                      (lastQuestionValues.a === b && lastQuestionValues.b === a)));

            const y2Coeff = a * b;

            let questionText = `x²`;

                questionText += `${xyCoeff >= 0 ? '+' : ''}${xyCoeff === 1 ? '' : xyCoeff === -1 ? '-' : xyCoeff}xy`;
            }
            // y²係数が1の場合は省略
            const y2Display = y2Coeff === 1 ? '+' : y2Coeff === -1 ? '-' : (y2Coeff >= 0 ? '+' : '') + y2Coeff;
            questionText += `${y2Display}y² = ______`;

            // y係数が1や-1の場合は省略表示
            const aDisplay = a === 1 ? '+' : a === -1 ? '-' : (a >= 0 ? '+' : '') + a;

            currentQuestion = {

                hasY: true
            };

            lastQuestionValues = { pattern: 1, a, b };
            document.getElementById('question').innerHTML = formatMathText(questionText);
            generateFactorizeHardAnswers();

        // 因数分解パターン4: c²x²-d² = (cx+d)(cx-d)

        function generateFactorizePattern5() {

        // 因数分解共通因数パターン: abx²±acx = ax(bx±c) 等
        function generateFactorizeCommonFactorPattern() {
            // サブパターン1〜6を均等に選択
            const subPattern = Math.floor(Math.random() * 6) + 1;

            let a, b, c;
            do {
                a = Math.floor(Math.random() * 9) + 1; // 1〜9
                const pair = getCoprimePositivePair();
                b = pair.b;
                c = pair.c;
            } while (lastQuestionValues && lastQuestionValues.pattern === 'cf' &&
                     lastQuestionValues.a === a && lastQuestionValues.b === b && lastQuestionValues.c === c &&
                     lastQuestionValues.subPattern === subPattern);

            const t1Coeff = a * b; // 高次項の係数
            const t2Coeff = a * c; // 低次項の係数
            const isPlus = (subPattern % 2 === 1); // 奇数サブパターンは+
            const sign = isPlus ? '+' : '-';

            // 問題テキスト（展開形）
            const t1Display = t1Coeff === 1 ? '' : t1Coeff;
            const t2Display = t2Coeff === 1 ? '' : t2Coeff;
            let questionText;
            if (subPattern <= 2) {
                questionText = `${t1Display}x²${sign}${t2Display}x = ______`;
            } else if (subPattern <= 4) {
                questionText = `${t1Display}x²${sign}${t2Display}xy = ______`;
            } else {
                questionText = `${t1Display}x²y${sign}${t2Display}xy² = ______`;
            }

            // 答え（因数分解形）
            const aDisplay = a === 1 ? '' : a;
            const bDisplay = b === 1 ? '' : b;
            const cDisplay = c === 1 ? '' : c;
            let answerText;
            if (subPattern <= 2) {
                answerText = `${aDisplay}x(${bDisplay}x${sign}${c})`;
            } else if (subPattern <= 4) {
                answerText = `${aDisplay}x(${bDisplay}x${sign}${cDisplay}y)`;
            } else {
                answerText = `${aDisplay}xy(${bDisplay}x${sign}${cDisplay}y)`;
            }

            currentQuestion = {
                text: questionText,
                a: a,
                b: b,
                c: c,
                subPattern: subPattern,
                isPlus: isPlus,
                original: questionText.replace(' = ______', ''),
                answer: answerText,
                hardPattern: 6,
                isCommonFactor: true
            };

            lastQuestionValues = { pattern: 'cf', a, b, c, subPattern };
            document.getElementById('question').innerHTML = formatMathText(questionText);
            generateFactorizeHardAnswers();
        }

        function generateFactorizeHardAnswers() {
            const pattern = currentQuestion.hardPattern;
            const answerGrid = document.getElementById('answerGrid');
            answerGrid.innerHTML = '';
            answerGrid.className = 'factors-grid';

            if (pattern === 6) {
                // 共通因数パターン - 2つ選択
                generateFactorizeCommonFactorAnswers();
            } else if (pattern === 1) {
                // (x+ay)(x+by) 形式 - 2つ選択
                generateFactorizePattern1Answers();
            } else if (pattern === 2 || pattern === 3) {
                // (cx+d)² または (cx+dy)² 形式 - 1つ+²選択
                generateFactorizeSquareAnswers();
            } else {
                // (cx+d)(cx-d) または (cx+dy)(cx-dy) 形式 - 2つ選択
                generateFactorizeDifferenceAnswers();
            }
        }

        function generateFactorizeCommonFactorAnswers() {
            // 共通因数パターンの解答選択肢
            const correctA = currentQuestion.a;
            const correctB = currentQuestion.b;
            const correctC = currentQuestion.c;
            const subPattern = currentQuestion.subPattern;
            const isPlus = currentQuestion.isPlus;
            const sign = isPlus ? '+' : '-';
            const hasXY = subPattern >= 5; // ⑤⑥はaxyが共通因数
            const hasY = subPattern >= 3; // ③〜⑥は残りの因数にyが含まれる

            // 左列: 共通因数の選択肢（ax または axy）

        function selectFactorizeHardAnswer(button, value, answerType) {
            const pattern = currentQuestion.hardPattern;

            if (answerType === 'pattern1') {
                // (x+ay)(x+by) 形式 - 2つ選択
                if (selectedAnswers.find(ans => ans.value === value)) {
                    selectedAnswers = selectedAnswers.filter(ans => ans.value !== value);
                    button.classList.remove('selected');
                } else if (selectedAnswers.filter(ans => !ans.isSquare).length < 2) {
                    selectedAnswers.push({ value, isSquare: false });
                    button.classList.add('selected');
                }
            } else if (answerType === 'square') {
                // (cx+d)² 形式 - 1つ選択
                // 他の非²ボタンの選択を解除
                document.querySelectorAll('.answer-btn').forEach(btn => {
                    if (btn !== button && btn.getAttribute('data-value') !== 'square' && btn.classList.contains('selected')) {
                        btn.classList.remove('selected');
                    }
                });
                selectedAnswers = selectedAnswers.filter(ans => ans.isSquare);

                if (button.classList.contains('selected')) {
                    button.classList.remove('selected');
                } else {
                    button.classList.add('selected');
                    selectedAnswers.push({ value, isSquare: false });
                }
            } else if (answerType === 'difference') {
                // (cx+d)(cx-d) 形式 - 2つ選択
                if (selectedAnswers.find(ans => ans.value && ans.value.c === value.c && ans.value.d === value.d)) {
                    selectedAnswers = selectedAnswers.filter(ans => !(ans.value && ans.value.c === value.c && ans.value.d === value.d));
                    button.classList.remove('selected');
                } else if (selectedAnswers.filter(ans => !ans.isSquare).length < 2) {
                    selectedAnswers.push({ value, isSquare: false });
                    button.classList.add('selected');
                }
            } else if (answerType === 'commonFactor') {
                // 共通因数パターン - 2つ選択（左:数値, 右:オブジェクト）
                if (typeof value === 'number') {
                    // 左列（共通因数の係数）
                    if (selectedAnswers.find(ans => ans.value === value && typeof ans.value === 'number')) {
                        selectedAnswers = selectedAnswers.filter(ans => !(typeof ans.value === 'number' && ans.value === value));
                        button.classList.remove('selected');
                    } else {
                        // 同じ列の既存選択を解除
                        selectedAnswers.filter(ans => typeof ans.value === 'number').forEach(ans => {
                            document.querySelectorAll('.answer-btn[data-position="left"].selected').forEach(btn => {
                                btn.classList.remove('selected');
                            });
                        });
                        selectedAnswers = selectedAnswers.filter(ans => typeof ans.value !== 'number');
                        selectedAnswers.push({ value, isSquare: false });
                        button.classList.add('selected');
                    }
                } else {
                    // 右列（残りの因数）
                    if (selectedAnswers.find(ans => ans.value && ans.value.b === value.b && ans.value.c === value.c)) {
                        selectedAnswers = selectedAnswers.filter(ans => !(ans.value && ans.value.b === value.b && ans.value.c === value.c));
                        button.classList.remove('selected');
                    } else {
                        // 同じ列の既存選択を解除
                        selectedAnswers.filter(ans => typeof ans.value === 'object' && ans.value.b !== undefined).forEach(ans => {
                            document.querySelectorAll('.answer-btn[data-position="right"].selected').forEach(btn => {
                                btn.classList.remove('selected');
                            });
                        });
                        selectedAnswers = selectedAnswers.filter(ans => !(typeof ans.value === 'object' && ans.value.b !== undefined));
                        selectedAnswers.push({ value, isSquare: false });
                        button.classList.add('selected');
                    }
                }
            }

            checkFactorizeHardAnswer();
        }

        function selectFactorizeHardSquare(button) {
            const hasSquare = selectedAnswers.some(ans => ans.isSquare);

            if (hasSquare) {
                selectedAnswers = selectedAnswers.filter(ans => !ans.isSquare);
                button.classList.remove('selected');
            } else {
                selectedAnswers.push({ value: 'square', isSquare: true });
                button.classList.add('selected');
            }

            checkFactorizeHardAnswer();
        }

        function checkFactorizeHardAnswer() {
            const pattern = currentQuestion.hardPattern;

            if (pattern === 6) {
                // 共通因数パターン
                const correctA = currentQuestion.a;
                const correctB = currentQuestion.b;
                const correctC = currentQuestion.c;
                const nonSquareAnswers = selectedAnswers.filter(ans => !ans.isSquare);

                // 左の値（数値）と右の値（オブジェクト）を分離
                const leftAns = nonSquareAnswers.find(ans => typeof ans.value === 'number');
                const rightAns = nonSquareAnswers.find(ans => typeof ans.value === 'object' && ans.value.b !== undefined);

                // 1つ選択で正解なら中間音
                if (nonSquareAnswers.length === 1) {
                    if (leftAns && leftAns.value === correctA) {
                        playSound(partialCorrectSound);
                    } else if (rightAns && rightAns.value.b === correctB && rightAns.value.c === correctC) {
                        playSound(partialCorrectSound);
                    } else {
                        wrongAnswer();
                        return;
                    }
                }

                // 2つ選択で判定
                if (nonSquareAnswers.length === 2) {
                    if (leftAns && rightAns &&
                        leftAns.value === correctA &&
                        rightAns.value.b === correctB &&
                        rightAns.value.c === correctC) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                }

                // ²ボタンを押したら不正解
                if (selectedAnswers.some(ans => ans.isSquare)) {
                    wrongAnswer();
                }

            } else if (pattern === 1) {
                // (x+ay)(x+by) 形式
                const correctA = currentQuestion.a;
                const correctB = currentQuestion.b;
                const nonSquareAnswers = selectedAnswers.filter(ans => !ans.isSquare);

                // 1つ選択で正解なら中間音
                if (nonSquareAnswers.length === 1) {
                    const val = nonSquareAnswers[0].value;
                    if (val === correctA || val === correctB) {
                        playSound(partialCorrectSound);
                    } else {
                        wrongAnswer();
                        return;
                    }
                }

                // 2つ選択で判定
                if (nonSquareAnswers.length === 2) {
                    const values = nonSquareAnswers.map(ans => ans.value);
                    if (values.includes(correctA) && values.includes(correctB)) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                }

                // ²ボタンを押したら不正解
                if (selectedAnswers.some(ans => ans.isSquare)) {
                    wrongAnswer();
                }

            } else if (pattern === 2 || pattern === 3) {
                // (cx+d)² または (cx+dy)² 形式
                const correctC = currentQuestion.c;
                const correctD = currentQuestion.d;
                const hasSquare = selectedAnswers.some(ans => ans.isSquare);
                const nonSquareAnswers = selectedAnswers.filter(ans => !ans.isSquare);

                if (nonSquareAnswers.length === 1 && !hasSquare) {
                    const val = nonSquareAnswers[0].value;
                    if (val.c === correctC && val.d === correctD) {
                        playSound(partialCorrectSound);
                    } else {
                        wrongAnswer();
                        return;
                    }
                }

                if (nonSquareAnswers.length === 1 && hasSquare) {
                    const val = nonSquareAnswers[0].value;
                    if (val.c === correctC && val.d === correctD) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                }

                // 2つの非²選択は不正解
                if (nonSquareAnswers.length >= 2) {
                    wrongAnswer();
                }

            } else if (pattern === 4 || pattern === 5) {
                // (cx+d)(cx-d) 形式
                const correctC = currentQuestion.c;
                const correctD = currentQuestion.d;
                const nonSquareAnswers = selectedAnswers.filter(ans => !ans.isSquare);

                // 1つ選択で正解なら中間音
                if (nonSquareAnswers.length === 1) {
                    const val = nonSquareAnswers[0].value;
                    if (val.c === correctC && Math.abs(val.d) === correctD) {
                        playSound(partialCorrectSound);
                    } else {
                        wrongAnswer();
                        return;
                    }
                }

                // 2つ選択で判定
                if (nonSquareAnswers.length === 2) {
                    const vals = nonSquareAnswers.map(ans => ans.value);
                    // 両方がcorrectCで、dが+correctDと-correctDであること
                    const hasPlus = vals.some(v => v.c === correctC && v.d === correctD);
                    const hasMinus = vals.some(v => v.c === correctC && v.d === -correctD);
                    if (hasPlus && hasMinus) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                }

                // ²ボタンを押したら不正解
                if (selectedAnswers.some(ans => ans.isSquare)) {
                    wrongAnswer();
                }
            }
        }

        function generateFactorizeAnswers() {
            const correctP = currentQuestion.p;
            const correctQ = currentQuestion.q;
            const isSquare = correctP === correctQ;

            let leftChoices, rightChoices;

            if (isSquare) {
                // 2乗問題の場合：正解は1つだけ、²と組み合わせる
                // 左側の選択肢（正解1つ + ダミー3つ）
                leftChoices = new Set([correctP]);
                while (leftChoices.size < 4) {
                    const candidate = getRandomNonZero();
                    if (candidate !== correctP) {
                        leftChoices.add(candidate);
                    }
                }

                // 右側の選択肢（ダミー3つのみ、正解は含めない）
                rightChoices = new Set();
                while (rightChoices.size < 3) {
                    const candidate = getRandomNonZero();
                    if (candidate !== correctP && !leftChoices.has(candidate)) {
                        rightChoices.add(candidate);
                    }
                }
            } else {
                // 通常問題の場合：正解の2つをランダムに左右に振り分け
                const leftCorrect = Math.random() < 0.5 ? correctP : correctQ;
                const rightCorrect = leftCorrect === correctP ? correctQ : correctP;

                // 左側の選択肢（正解1つ + ダミー3つ）
                leftChoices = new Set([leftCorrect]);
                while (leftChoices.size < 4) {
                    const candidate = getRandomNonZero();
                    if (candidate !== correctP && candidate !== correctQ) {
                        leftChoices.add(candidate);
                    }
                }

                // 右側の選択肢（正解1つ + ダミー2つ）
                rightChoices = new Set([rightCorrect]);
                while (rightChoices.size < 3) {
                    const candidate = getRandomNonZero();
                    if (candidate !== correctP && candidate !== correctQ && !leftChoices.has(candidate)) {
                        rightChoices.add(candidate);
                    }
                }
            }

            const leftArray = Array.from(leftChoices).sort(() => Math.random() - 0.5);
            const rightArray = Array.from(rightChoices).sort(() => Math.random() - 0.5);

            const answerGrid = document.getElementById('answerGrid');
            answerGrid.innerHTML = '';

            // 左側4個と右側4個を交互に配置して縦4×横2にする
            for (let i = 0; i < 4; i++) {
                // 左側のボタン
                const leftBtn = document.createElement('button');
                leftBtn.className = 'answer-btn';
                leftBtn.innerHTML = formatMathText(`(x${leftArray[i] >= 0 ? '+' : ''}${leftArray[i]})`);
                leftBtn.setAttribute('data-position', 'left');
                leftBtn.setAttribute('data-value', leftArray[i]);
                leftBtn.onclick = () => selectFactorizeAnswer(leftBtn, leftArray[i]);
                answerGrid.appendChild(leftBtn);

                // 右側のボタン
                if (i < 3) {
                    const rightBtn = document.createElement('button');
                    rightBtn.className = 'answer-btn';
                    rightBtn.innerHTML = formatMathText(`(x${rightArray[i] >= 0 ? '+' : ''}${rightArray[i]})`);
                    rightBtn.setAttribute('data-position', 'right');
                    rightBtn.setAttribute('data-value', rightArray[i]);
                    rightBtn.onclick = () => selectFactorizeAnswer(rightBtn, rightArray[i]);
                    answerGrid.appendChild(rightBtn);
                } else {
                    // 右下に²ボタンを配置
                    const squareBtn = document.createElement('button');
                    squareBtn.className = 'answer-btn';
                    squareBtn.textContent = '²';
                    squareBtn.setAttribute('data-position', 'right');
                    squareBtn.setAttribute('data-value', 'square');
                    squareBtn.onclick = () => selectSquare(squareBtn);
                    answerGrid.appendChild(squareBtn);

        function selectFactorizeAnswer(button, value) {
            if (selectedAnswers.find(ans => ans.value === value)) {
                selectedAnswers = selectedAnswers.filter(ans => ans.value !== value);
                button.classList.remove('selected');
            } else if (selectedAnswers.length < 2) {
                selectedAnswers.push({ value, isSquare: false });
                button.classList.add('selected');
            }

            checkFactorizeAnswer();
        }

        function selectSquare(button) {
            if (selectedAnswers.find(ans => ans.isSquare)) {
                selectedAnswers = selectedAnswers.filter(ans => !ans.isSquare);
                button.classList.remove('selected');
            } else if (selectedAnswers.length === 1) {
                selectedAnswers.push({ isSquare: true });
                button.classList.add('selected');
            }

            checkFactorizeAnswer();
        }

        function checkFactorizeAnswer() {
            // 中間正解音の再生チェック / 不正解判定
            if (selectedAnswers.length === 1) {
                const firstAnswer = selectedAnswers[0];
                if (!firstAnswer.isSquare) {
                    // 数値選択肢の場合
                    if (firstAnswer.value === currentQuestion.p || firstAnswer.value === currentQuestion.q) {
                        // 正解の選択肢
                        playSound(partialCorrectSound);
                    } else {
                        // 不正解の選択肢を選んだら即座に不正解判定
                        wrongAnswer();
                        return;
                    }
                }
            }

            if (selectedAnswers.length === 2) {
                const values = selectedAnswers.filter(ans => !ans.isSquare).map(ans => ans.value);
                const hasSquare = selectedAnswers.some(ans => ans.isSquare);

                if (hasSquare && values.length === 1) {
                    if (values[0] === currentQuestion.p && currentQuestion.p === currentQuestion.q) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                } else if (!hasSquare && values.length === 2) {
                    if ((values.includes(currentQuestion.p) && values.includes(currentQuestion.q)) &&
                        currentQuestion.p !== currentQuestion.q) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                } else {
                    wrongAnswer();
                }
            }
        }

        function correctAnswer() {
            // すでに回答済みの場合は処理しない（複数回カウントを防止）
            if (answeredCurrentQuestion) {
                return;
            }
            answeredCurrentQuestion = true;

            // ヘルプボタンを非表示にし、タイマーをクリア
            hideHelpButton();

            // 最終問題のタイムアウトをクリア
            if (lastQuestionTimeout) {
                clearTimeout(lastQuestionTimeout);
                lastQuestionTimeout = null;
            }

            playSound(correctSound);

            // 画面の明るさを戻す
            document.body.classList.remove('gauge-depleted');

            // コンボゲージが残っているかチェック
            if (comboGaugeValue > 0) {
                // コンボ継続
                consecutiveCorrect++;
            } else {
                // コンボリセット（1から数え直し）
                consecutiveCorrect = 1;
            }

            // 最大コンボを更新
            if (consecutiveCorrect > maxCombo) {
                maxCombo = consecutiveCorrect;
            }

            correctAnswers++;

            // 得点計算: (10+n)²点
            const totalPoints = Math.pow(10 + consecutiveCorrect, 2);
            score += totalPoints;

            // 解答時間を計算（0.1秒単位）
            const answerTime = ((Date.now() - questionStartTime) / 1000).toFixed(1);

            questionHistory.push({
                question: currentQuestion.original,
                answer: currentQuestion.answer,
                correct: true,
                time: answerTime
            });

            document.getElementById('score').textContent = score;

            // コンボ表示
            showComboAnimation(consecutiveCorrect);

            // 10コンボごとの紙吹雪演出
            if (consecutiveCorrect % 10 === 0 && consecutiveCorrect > 0) {
                triggerConfetti();
            }

            // 5問連続正解の演出
            if (consecutiveCorrect % 5 === 0 && consecutiveCorrect > 0) {
                triggerCelebration();
            }

            document.querySelectorAll('.answer-btn.selected').forEach(btn => {
                btn.classList.add('correct');
            });

            // ゲージを停止（次の問題が表示されるまで待つ）
            stopComboGauge();

            // 最終問題は1秒待ってから結果画面へ、それ以外はすぐに次の問題へ
            if (isLastQuestion) {
                setTrackedTimeout(() => {
                    endGame();

                generateQuestion();

        // テキスト内の√記号を適切な形式に変換する関数
        function formatTextWithSquareRoot(text) {

            return text.replace(/√(\d+)/g, (match, number) => formatSquareRoot(number));

        // 平方根を簡単化する関数（√x を a√b の形にする）
        function simplifySquareRoot(x) {
            let a = 1;
            let b = x;

            // 完全平方数かチェック
            const sqrt = Math.sqrt(x);
            if (Number.isInteger(sqrt)) {
                return { a: sqrt, b: 1 };
            }

            // 平方数で割っていく
            for (let i = 2; i * i <= b; i++) {
                while (b % (i * i) === 0) {
                    a *= i;
                    b /= (i * i);
                }
            }

            return { a, b };
        }

        // 平方数の因数を含む8-100の数をランダム生成（√の中身は17未満に制限）
        function getRandomSquareRootNumber() {
            const shouldBeHighB = Math.random() < 0.2; // 20%の確率でb≧11
            let num;
            let attempts = 0;
            const maxAttempts = 100;

            do {
                num = Math.floor(Math.random() * 93) + 8; // 8から100までの整数
                const simplified = simplifySquareRoot(num);

                // 平方数の因数を含む（a > 1が必須）数で、かつb < 17、かつb≧11またはb≦10の条件を満たす
                const isSimplifiable = simplified.a > 1;
                const isBUnder17 = simplified.b < 17; // √の中身は17未満に制限
                const meetsCondition = shouldBeHighB ? (simplified.b >= 11 && simplified.b < 17) : (simplified.b <= 10);

                if (isSimplifiable && isBUnder17 && meetsCondition) {
                    break;
                }

                attempts++;
            } while (attempts < maxAttempts);

            // 最大試行回数を超えた場合は条件を緩和して任意の簡単化可能な数（a > 1, b < 17）を返す
            if (attempts >= maxAttempts) {
                do {
                    num = Math.floor(Math.random() * 93) + 8;
                    const simplified = simplifySquareRoot(num);
                } while (simplifySquareRoot(num).a <= 1 || simplifySquareRoot(num).b >= 17);
            }

            return num;
        }

        // 平方根問題を生成
        function generateSquareRootQuestion() {
            // ハードモードで35%の確率で分数問題を出題
            if (difficultyMode === 'hard' && Math.random() < 0.35) {
                generateSquareRootHardQuestion();
                return;
            }

            let x;
            do {
                x = getRandomSquareRootNumber();
                // 直前の問題と同じでないかチェック
            } while (lastQuestionValues && lastQuestionValues.x === x);

            const simplified = simplifySquareRoot(x);
            const correctA = simplified.a;
            const correctB = simplified.b;

            currentQuestion = {
                x: x,
                a: correctA,
                b: correctB,
                original: `√${x}`,
                answer: correctB === 1 ? `${correctA}` : `${correctA}√${correctB}`,
                isFraction: false
            };

            // 現在の問題の値を保存
            lastQuestionValues = { x };

            document.getElementById('question').innerHTML = `${formatSquareRoot(x)} = ____`;
            generateSquareRootAnswers();
        }

        // 平方根ハード問題を生成（分数形式: ab/√b = a√b）
        function generateSquareRootHardQuestion() {
            // aは1〜9、bは2,3,5,6,7,10のいずれか
            const possibleB = [2, 3, 5, 6, 7, 10];
            let a, b;

            do {
                a = Math.floor(Math.random() * 9) + 1; // 1〜9
                b = possibleB[Math.floor(Math.random() * possibleB.length)];
            } while (lastQuestionValues && lastQuestionValues.isFraction &&
                     lastQuestionValues.a === a && lastQuestionValues.b === b);

            // 分子 = a * b
            const numerator = a * b;

            currentQuestion = {
                a: a,
                b: b,
                numerator: numerator,
                original: `${numerator}/√${b}`,
                answer: a === 1 ? `√${b}` : `${a}√${b}`,
                isFraction: true,
                singleSelection: a === 1 // a=1の場合は√bのみ選択で正解
            };

            lastQuestionValues = { isFraction: true, a, b };

            // 分数表示
            const questionHTML = `<span class="fraction"><span class="numerator">${numerator}</span><span class="denominator">${formatSquareRoot(b)}</span></span> = ____`;
            document.getElementById('question').innerHTML = questionHTML;

            generateSquareRootHardAnswers();
        }

        // 平方根ハード問題の解答ボタンを生成
        function generateSquareRootHardAnswers() {
            const correctA = currentQuestion.a;
            const correctB = currentQuestion.b;
            const singleSelection = currentQuestion.singleSelection;

            // 整数の選択肢を生成（左側4つ）
            const aChoices = new Set([correctA]);
            while (aChoices.size < 4) {
                const candidate = Math.floor(Math.random() * 9) + 1; // 1〜9
                aChoices.add(candidate);
            }

            // √の選択肢を生成（右側4つ）- 正解を含む
            const possibleB = [2, 3, 5, 6, 7, 10];
            const bChoices = new Set([correctB]);
            while (bChoices.size < 4) {
                const candidate = possibleB[Math.floor(Math.random() * possibleB.length)];
                bChoices.add(candidate);
            }

            const aArray = Array.from(aChoices).sort(() => Math.random() - 0.5);
            const bArray = Array.from(bChoices).sort(() => Math.random() - 0.5);

            const answerGrid = document.getElementById('answerGrid');
            answerGrid.innerHTML = '';
            answerGrid.className = 'answer-grid';

            for (let i = 0; i < 4; i++) {
                // 左側: 整数
                const aBtn = document.createElement('button');
                aBtn.className = 'answer-btn';
                aBtn.textContent = aArray[i];
                aBtn.setAttribute('data-type', 'a');
                aBtn.setAttribute('data-value', aArray[i]);
                aBtn.onclick = () => selectSquareRootHardAnswer(aBtn, 'a', aArray[i]);
                answerGrid.appendChild(aBtn);

                // 右側: √b
                const bBtn = document.createElement('button');
                bBtn.className = 'answer-btn';
                bBtn.innerHTML = formatSquareRoot(bArray[i]);
                bBtn.setAttribute('data-type', 'b');
                bBtn.setAttribute('data-value', bArray[i]);
                bBtn.onclick = () => selectSquareRootHardAnswer(bBtn, 'b', bArray[i]);
                answerGrid.appendChild(bBtn);
            }
        }

        function selectSquareRootHardAnswer(button, type, value) {
            // 同じタイプの既存選択を解除
            document.querySelectorAll('.answer-btn').forEach(btn => {
                if (btn !== button && btn.classList.contains('selected')) {
                    const btnType = btn.getAttribute('data-type');
                    if (btnType === type) {
                        btn.classList.remove('selected');
                    }
                }
            });

            button.classList.toggle('selected');

            if (button.classList.contains('selected')) {
                selectedAnswers = selectedAnswers.filter(ans => ans.type !== type);
                selectedAnswers.push({ type, value });
            } else {
                selectedAnswers = selectedAnswers.filter(ans => !(ans.type === type && ans.value === value));
            }

            checkSquareRootHardAnswer();
        }

        function checkSquareRootHardAnswer() {
            const correctA = currentQuestion.a;
            const correctB = currentQuestion.b;
            const singleSelection = currentQuestion.singleSelection;

            const hasCorrectA = selectedAnswers.some(ans => ans.type === 'a' && ans.value === correctA);
            const hasCorrectB = selectedAnswers.some(ans => ans.type === 'b' && ans.value === correctB);

            if (singleSelection) {
                // a=1の場合: √bのみ選択で正解
                if (selectedAnswers.length === 1) {
                    const ans = selectedAnswers[0];
                    if (ans.type === 'b' && ans.value === correctB) {
                        correctAnswer();
                    } else if (ans.type === 'a') {
                        // 整数を選択したら不正解
                        wrongAnswer();
                    } else if (ans.type === 'b' && ans.value !== correctB) {
                        wrongAnswer();
                    }
                }
                // 2つ選択した場合は不正解
                if (selectedAnswers.length >= 2) {
                    wrongAnswer();
                }
            } else {
                // a>1の場合: aとbの両方選択で正解
                if (selectedAnswers.length === 1) {
                    const ans = selectedAnswers[0];
                    if ((ans.type === 'a' && ans.value === correctA) ||
                        (ans.type === 'b' && ans.value === correctB)) {
                        playSound(partialCorrectSound);
                    } else {
                        wrongAnswer();
                        return;
                    }
                }

                if (selectedAnswers.length === 2) {
                    if (hasCorrectA && hasCorrectB) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                }
            }
        }

        // 平方根の解答ボタンを生成（4×2レイアウト）
        function generateSquareRootAnswers() {
            const correctA = currentQuestion.a;
            const correctB = currentQuestion.b;
            const isPerfectSquare = correctB === 1;

            // 整数の選択肢を生成（左側4つ）- 1は除外
            const aChoices = new Set([correctA]);
            while (aChoices.size < 4) {
                const candidate = Math.floor(Math.random() * 9) + 2; // 2-10の整数
                aChoices.add(candidate);
            }

            // √の選択肢を生成（右側4つ）
            const bChoices = new Set();
            if (!isPerfectSquare) {
                bChoices.add(correctB);
            }

            // 簡単化できない数（素数や平方数の因数を含まない数）を選択肢に追加
            const possibleB = [2, 3, 5, 6, 7, 10, 11, 13, 14, 15, 17, 19, 21, 22, 23];
            while (bChoices.size < 4) {
                const candidate = possibleB[Math.floor(Math.random() * possibleB.length)];
                bChoices.add(candidate);
            }

            const aArray = Array.from(aChoices).sort(() => Math.random() - 0.5);
            const bArray = Array.from(bChoices).sort(() => Math.random() - 0.5);

            const answerGrid = document.getElementById('answerGrid');
            answerGrid.innerHTML = '';
            answerGrid.className = 'answer-grid'; // 4×2グリッド

            // 左側4個と右側4個を交互に配置して縦4×横2にする
            for (let i = 0; i < 4; i++) {
                // 左側: 整数（a の部分）
                const aBtn = document.createElement('button');
                aBtn.className = 'answer-btn';
                aBtn.textContent = aArray[i];
                aBtn.setAttribute('data-type', 'a');
                aBtn.setAttribute('data-value', aArray[i]);
                aBtn.onclick = () => selectSquareRootAnswer(aBtn, 'a', aArray[i]);
                answerGrid.appendChild(aBtn);

                // 右側: √の数（√b の部分）
                const bBtn = document.createElement('button');
                bBtn.className = 'answer-btn';
                bBtn.innerHTML = formatSquareRoot(bArray[i]);
                bBtn.setAttribute('data-type', 'b');
                bBtn.setAttribute('data-value', bArray[i]);
                bBtn.onclick = () => selectSquareRootAnswer(bBtn, 'b', bArray[i]);
                answerGrid.appendChild(bBtn);
            }
        }

        // 平方根の解答を選択
        function selectSquareRootAnswer(button, type, value) {
            // 同じタイプの既存選択を解除
            document.querySelectorAll('.answer-btn').forEach(btn => {
                if (btn !== button && btn.classList.contains('selected')) {
                    const isLeftColumn = Array.from(btn.parentElement.children).indexOf(btn) % 2 === 0;
                    const otherType = isLeftColumn ? 'a' : 'b';
                    if (otherType === type) {
                        btn.classList.remove('selected');
                    }
                }
            });

            button.classList.toggle('selected');

            if (button.classList.contains('selected')) {
                selectedAnswers = selectedAnswers.filter(ans => ans.type !== type);
                selectedAnswers.push({ type, value });
            } else {
                selectedAnswers = selectedAnswers.filter(ans => !(ans.type === type && ans.value === value));
            }

            checkSquareRootAnswer();
        }

        // 平方根の解答をチェック
        function checkSquareRootAnswer() {
            const isPerfectSquare = currentQuestion.b === 1;

            if (isPerfectSquare) {
                // 完全平方数の場合、整数のみで正解
                const hasCorrectA = selectedAnswers.some(ans => ans.type === 'a' && ans.value === currentQuestion.a);

                // 整数のみを選択している場合
                if (selectedAnswers.length === 1 && selectedAnswers[0].type === 'a') {
                    if (hasCorrectA) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                } else if (selectedAnswers.length >= 1) {
                    // √を選んでいる場合は即座に不正解
                    const hasWrongB = selectedAnswers.some(ans => ans.type === 'b');
                    if (hasWrongB) {
                        wrongAnswer();
                    } else if (selectedAnswers.length === 2) {
                        // 整数を2つ選んでいる場合も不正解
                        wrongAnswer();
                    }
                }
            } else {
                // 平方数でない場合、a√bの形で解答
                const hasCorrectA = selectedAnswers.some(ans => ans.type === 'a' && ans.value === currentQuestion.a);
                const hasCorrectB = selectedAnswers.some(ans => ans.type === 'b' && ans.value === currentQuestion.b);

                // 中間正解音の再生チェック / 不正解判定
                if (selectedAnswers.length === 1) {
                    const firstAnswer = selectedAnswers[0];
                    if ((firstAnswer.type === 'a' && firstAnswer.value === currentQuestion.a) ||
                        (firstAnswer.type === 'b' && firstAnswer.value === currentQuestion.b)) {
                        playSound(partialCorrectSound);
                    } else {
                        // 不正解の選択肢を1つ選んだ時点で不正解
                        wrongAnswer();
                        return;
                    }
                }

                // 両方選択している場合
                if (selectedAnswers.length === 2) {
                    if (hasCorrectA && hasCorrectB) {
                        correctAnswer();
                    } else {
                        wrongAnswer();
                    }
                }
            }
        }

        // ページ読み込み時にキャッチコピーを表示
        window.addEventListener('DOMContentLoaded', () => {
            displayRandomCatchphrase();
        });
    </script>
