<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学バトル - 展開・因数分解ゲーム</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tutorial.css">
</head>
<body>
    <div class="container">
        <div id="titleScreen" class="screen title-screen active">
            <!-- 背景の流れる数式 -->
            <div class="math-formula-bg flow-1">(<span class="math-x">x</span>+3)(<span class="math-x">x</span>-2) = <span class="math-x">x</span>²+<span class="math-x">x</span>-6</div>
            <div class="math-formula-bg flow-2"><span class="math-x">x</span>²-9 = (<span class="math-x">x</span>+3)(<span class="math-x">x</span>-3)</div>
            <div class="math-formula-bg flow-3">(<span class="math-x">x</span>+5)² = <span class="math-x">x</span>²+10<span class="math-x">x</span>+25</div>
            <div class="math-formula-bg flow-4"><span class="math-x">x</span>²-7<span class="math-x">x</span>+12 = (<span class="math-x">x</span>-3)(<span class="math-x">x</span>-4)</div>

            <!-- KEC数学科ラボへのリンク（左上） -->
            <a class="lab-link" href="https://taka-t-p.github.io/math-app-portal/">KEC数学科ラボへ</a>

            <!-- 効果音切り替え（右上） -->
            <button class="audio-toggle active" onclick="toggleAudio()" id="audioToggleBtn">
                <span id="audioIcon">🔊</span>
                <span>効果音ON</span>
            </button>

            <h1 class="title" id="gameTitle">因数×展開 FIGHT!</h1>
            <p class="catchphrase" id="catchphrase"></p>

            <!-- はじめての因数×展開講座（チュートリアル）への入口 -->
            <button class="tu-entry-btn" onclick="Tutorial.openCourses()" id="tutorialEntryBtn">
                <span class="tu-entry-main">📘 はじめての因数×展開講座</span>
            </button>

            <!-- 時間選択 -->
            <div style="margin-bottom: 10px;">
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="btn time-btn active" onclick="selectTime(60)" id="time60">1分</button>
                    <button class="btn time-btn" onclick="selectTime(180)" id="time180">3分</button>
                </div>
            </div>

            <!-- 難易度選択 -->
            <div style="margin-bottom: 10px;">
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="btn difficulty-btn active" onclick="selectDifficulty('normal')" id="difficultyNormal" data-difficulty="normal">ノーマル</button>
                    <button class="btn difficulty-btn" onclick="selectDifficulty('hard')" id="difficultyHard" data-difficulty="hard">ハード</button>
                </div>
            </div>

            <div class="mode-buttons">
                <div class="mode-button-row">
                    <button class="btn" onclick="startGame('expand')">展開ラッシュ</button>
                    <button class="help-btn" onclick="showHelp('expand')">？</button>
                </div>
                <div class="mode-button-row">
                    <button class="btn" onclick="startGame('factorize')">因数分解ラッシュ</button>
                    <button class="help-btn" onclick="showHelp('factorize')">？</button>
                </div>
                <div class="mode-button-row">
                    <button class="btn" onclick="startGame('squareRoot')">平方根ラッシュ</button>
                    <button class="help-btn" onclick="showHelp('squareRoot')">？</button>
                </div>
            </div>

            <!-- 著作権表示 -->
            <div style="margin-top: 40px; font-size: 12px; color: #64748b; opacity: 0.85;">
                ©2026 T.TAKEMOTO / KEC Glows
            </div>
        </div>

        <div id="gameScreen" class="screen game-screen">
            <div class="game-header">
                <div class="score">スコア: <span id="score">0</span></div>
                <div class="timer" id="timerDisplay">残り時間: <span id="timeLeft">60</span>秒</div>
            </div>
            <div class="game-controls-fixed">
                <button class="control-btn" onclick="retryGame()">リトライ</button>
                <button class="control-btn" onclick="goToTitle()">戻る</button>
            </div>
            <div class="question-area">
                <div class="combo-gauge-container" id="comboGaugeContainer" style="display: none;">
                    <div class="combo-gauge-label">コンボ継続ゲージ</div>
                    <div class="combo-gauge-bar">
                        <div id="comboGaugeFill" class="combo-gauge-fill"></div>
                    </div>
                </div>
                <div class="combo-help-container">
                    <div id="comboDisplay" class="combo-display"></div>
                    <button id="helpButton" class="help-button" onclick="showCorrectAnswerHint()">ヒント</button>
                </div>
                <div id="question" class="question"></div>
                <div id="answerGrid" class="answer-grid"></div>
            </div>
        </div>

        <div id="countdownOverlay" class="countdown-overlay">
            <div id="countdownNumber" class="countdown-number"></div>
        </div>

        <!-- ヘルプ画面 -->
        <div id="helpScreen" class="screen help-screen">
            <div class="help-header">
                <div class="help-title" id="helpTitle">ヘルプ</div>
                <button class="back-btn" onclick="closeHelp()">戻る</button>
            </div>
            <div class="help-content" id="helpContent">
                <!-- ヘルプコンテンツがJavaScriptで動的に挿入されます -->
            </div>
            <div class="tu-help-link">
                <button class="tu-btn tu-btn-primary" onclick="Tutorial.openFromHelp()">基礎からじっくり学ぶ → チュートリアルへ</button>
            </div>
        </div>

        <!-- チュートリアル：講座選択 -->
        <div id="tutorialCoursesScreen" class="screen tu-screen">
            <div class="tu-topbar">
                <button class="tu-btn tu-btn-sub" onclick="Tutorial.goTitle()">← タイトル</button>
                <div class="tu-topbar-title">📘 はじめての因数×展開講座</div>
            </div>
            <div class="tu-scroll">
                <div class="tu-page" id="tutorialCoursesContent"></div>
            </div>
        </div>

        <!-- チュートリアル：レッスン一覧 -->
        <div id="tutorialLessonsScreen" class="screen tu-screen">
            <div class="tu-topbar">
                <button class="tu-btn tu-btn-sub" onclick="Tutorial.openCourses()">← 講座一覧</button>
                <div class="tu-topbar-title" id="tutorialLessonsTitle"></div>
            </div>
            <div class="tu-scroll">
                <div class="tu-page" id="tutorialLessonsContent"></div>
            </div>
        </div>

        <!-- チュートリアル：レッスン -->
        <div id="tutorialLessonScreen" class="screen tu-screen">
            <div class="tu-topbar">
                <button class="tu-btn tu-btn-sub" onclick="Tutorial.backToLessons()">← レッスン一覧</button>
                <div class="tu-topbar-title" id="tutorialLessonHeading"></div>
                <button class="tu-btn tu-btn-sub tu-topbar-right" onclick="Tutorial.goTitle()">タイトル</button>
            </div>
            <div class="tu-stepbar" id="tutorialStepBar"></div>
            <div class="tu-scroll" id="tutorialLessonScroll">
                <div class="tu-page" id="tutorialLessonContent"></div>
            </div>
            <div class="tu-navbar" id="tutorialNavBar"></div>
        </div>

        <div id="resultScreen" class="screen result-screen">
            <div class="game-controls-fixed">
                <button class="control-btn" onclick="retryGame()">リトライ</button>
                <button class="control-btn" onclick="goToTitle()">戻る</button>
            </div>
            <div class="result-header">
                <h2 class="result-title">ゲーム終了！</h2>
                <div id="rankCard" style="background: linear-gradient(135deg, #fef3c7 0%, #fed7aa 50%, #fbbf24 100%); border: 3px solid #f59e0b; border-radius: 16px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);">
                    <div id="rankLabel" style="font-size: clamp(14px, 3.5vw, 18px); font-weight: 600; color: #92400e; margin-bottom: 5px;">段位</div>
                    <div id="rankDisplay" style="font-size: clamp(32px, 8vw, 56px); font-weight: 700; color: #78350f; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);"></div>
                </div>
                <div class="result-stats">
                    <div class="stat-item">
                        <div class="stat-label">戦績</div>
                        <div style="display: flex; gap: 15px; justify-content: center; align-items: baseline; flex-wrap: wrap; margin-top: 8px;">
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <div style="font-size: clamp(10px, 2.5vw, 12px); color: #64748b; margin-bottom: 2px;">正解</div>
                                <div class="stat-value" id="correctCount" style="color: #10b981;">0</div>
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <div style="font-size: clamp(10px, 2.5vw, 12px); color: #64748b; margin-bottom: 2px;">不正解</div>
                                <div class="stat-value" id="wrongCount" style="color: #ef4444;">0</div>
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <div style="font-size: clamp(10px, 2.5vw, 12px); color: #64748b; margin-bottom: 2px;">最大コンボ</div>
                                <div class="stat-value" id="maxComboCount" style="color: #f59e0b;">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">スコア</div>
                        <div style="display: flex; gap: 15px; justify-content: center; align-items: baseline; flex-wrap: wrap; margin-top: 8px;">
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <div style="font-size: clamp(10px, 2.5vw, 12px); color: #64748b; margin-bottom: 2px;">最終</div>
                                <div class="stat-value" id="finalScore" style="color: #3b82f6;">0</div>
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <div style="font-size: clamp(10px, 2.5vw, 12px); color: #64748b; margin-bottom: 2px;">ハイスコア</div>
                                <div class="stat-value" id="highScore" style="color: #f59e0b;">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="history">
                <div class="history-title" id="historyTitle">問題履歴</div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- ゲーム本体（読み込み順に依存するため順番を変えないこと） -->
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ranks.js"></script>
    <script src="js/help.js"></script>
    <script src="js/problems/common.js"></script>
    <script src="js/problems/expand.js"></script>
    <script src="js/problems/factorize.js"></script>
    <script src="js/problems/square-root.js"></script>
    <script src="js/hint.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>

    <!-- はじめての因数×展開講座（チュートリアル） -->
    <script src="js/tutorial/renderer.js"></script>
    <script src="js/tutorial/interactions.js"></script>
    <script src="js/tutorial/engine.js"></script>
    <script src="js/tutorial/lessons/expansion.js"></script>
    <script src="js/tutorial/lessons/factorization.js"></script>
    <script src="js/tutorial/lessons/square-root.js"></script>
</body>
</html>
